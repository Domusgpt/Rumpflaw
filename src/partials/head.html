<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{ meta.csp }}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="robots" content="{{ meta.robots }}">
{{{ meta.canonicalTag }}}
<meta name="theme-color" content="#0E1C28">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="generator" content="rumpflaw-site {{ build.v }} ({{ build.env }})">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ firm.name }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{ meta.ogImage }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{{{ meta.ogUrlTag }}}
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ root }}assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ root }}assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ root }}assets/img/apple-touch-icon.png">
<link rel="manifest" href="{{ root }}manifest.webmanifest">
<link rel="preload" href="{{ root }}assets/fonts/fraunces-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ root }}assets/fonts/inter-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ root }}assets/vendor/lenis/lenis.css">
<link rel="stylesheet" href="{{ root }}assets/css/site.css?v={{ build.v }}">
<script>{{{ meta.bootInline }}}</script>
{{{ meta.jsonld }}}
